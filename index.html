    <!-- REALTIME API FETCHING ENGINE (ESPN MAIN + API-FOOTBALL RAPIDAPI FALLBACK) -->
    <script>
        let allMatchesGrouped = {}; 
        let autoScrollInterval = null; 

        // Realtime Clock WIB
        function updateClockWIB() {
            const options = { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const wibTimeString = new Intl.DateTimeFormat('id-ID', options).format(new Date());
            document.getElementById('live-clock').textContent = wibTimeString.replace(/\./g, ':');
        }
        setInterval(updateClockWIB, 1000);
        updateClockWIB();

        // Banner Slider Logic
        let currentSlide = 0;
        function setSlide(index) {
            currentSlide = index;
            document.getElementById('carousel-track').style.transform = `translateX(-${currentSlide * 100}%)`;
        }
        setInterval(() => {
            currentSlide = (currentSlide + 1) % 4;
            setSlide(currentSlide);
        }, CONFIG.AUTO_SLIDE_INTERVAL);

        // Auto Scroll Horizontal Slider Match
        function startHorizontalAutoScroll() {
            const slider = document.getElementById('horizontal-match-slider');
            if (!slider) return;

            if (autoScrollInterval) clearInterval(autoScrollInterval);

            autoScrollInterval = setInterval(() => {
                if (slider.scrollLeft + slider.clientWidth >= slider.scrollWidth - 5) {
                    slider.scrollTo({ left: 0, behavior: 'smooth' });
                } else {
                    slider.scrollBy({ left: 260, behavior: 'smooth' });
                }
            }, 3000);
        }

        // Helper Prediksi & HDP Konsisten
        function generateMatchData(idStr) {
            let hash = 0;
            for (let i = 0; i < idStr.length; i++) {
                hash = idStr.charCodeAt(i) + ((hash << 5) - hash);
            }
            hash = Math.abs(hash);

            const hdps = ["0 : 0", "0 : 1/4", "0 : 1/2", "0 : 3/4", "0 : 1", "1/4 : 0", "1/2 : 0", "3/4 : 0"];
            const hdpVal = hdps[hash % hdps.length];

            const predHome = (hash % 3);
            const predAway = ((hash >> 2) % 3);
            const prediction = `${predHome} - ${predAway}`;

            return { hdp: hdpVal, prediction: prediction };
        }

        // =======================================================
        // INTEGRASI API REALTIME + API-FOOTBALL (RAPIDAPI) FALLBACK
        // =======================================================
        async function fetchRealtimeMatches() {
            const syncElement = document.getElementById('sync-status');
            if(syncElement) syncElement.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-cyan-400 mr-1"></i> Syncing...`;

            // 1. API UTAMA: ESPN Scoreboard API
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);

                const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard', { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("API Utama Timeout/Error");

                const data = await response.json();
                if (data && data.events && data.events.length > 0) {
                    parsePrimaryEspnData(data.events);
                    if(syncElement) syncElement.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Live (ESPN API)`;
                    return;
                }
            } catch (error) {
                console.warn("API Utama ESPN bermasalah, beralih ke API-Football (RapidAPI)...", error);
            }

            // 2. API CADANGAN 1: API-Football (v3 via RapidAPI / API-SPORTS)
            if (CONFIG.RAPIDAPI_KEY && CONFIG.RAPIDAPI_KEY !== "" && CONFIG.RAPIDAPI_KEY !== "51e7d45e1dmsh13bd59dd41c23c0p18ae7ejsn98b0299ce018") {
                try {
                    if(syncElement) syncElement.innerHTML = `<i class="fa-solid fa-shield-halved text-amber-400 mr-1"></i> Sync (API-Football)...`;

                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000);

                    // Panggilan Endpoint Live Fixtures
                    const responseApiFootball = await fetch('https://api-football-v1.p.rapidapi.com/v3/fixtures?live=all', {
                        method: 'GET',
                        headers: {
                            'x-rapidapi-key': CONFIG.RAPIDAPI_KEY,
                            'x-rapidapi-host': 'api-football-v1.p.rapidapi.com'
                        },
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (responseApiFootball.ok) {
                        const dataFootball = await responseApiFootball.json();
                        if (dataFootball && dataFootball.response && dataFootball.response.length > 0) {
                            parseApiFootballData(dataFootball.response);
                            if(syncElement) syncElement.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Live (API-Football)`;
                            return;
                        }
                    }
                } catch (rapidErr) {
                    console.warn("API-Football RapidAPI bermasalah atau kuota habis, beralih ke engine cadangan berikutnya...", rapidErr);
                }
            }

            // 3. API CADANGAN 2: Fallback Engine Dynamic
            loadDynamicScoreEngine();
            if(syncElement) syncElement.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Live (Backup Active)`;
        }

        // PARSER 1: DATA ESPN PUBLIC SCOREBOARD
        function parsePrimaryEspnData(events) {
            let matchesList = [];

            events.forEach(event => {
                const competition = event.competitions[0];
                const leagueName = event.season?.slug ? event.season.slug.toUpperCase().replace(/-/g, ' ') : "LIGA UTAMA";
                
                const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
                const awayTeam = competition.competitors.find(c => c.homeAway === 'away');

                const statusState = event.status.type.state;
                if (statusState === 'post') return; 

                const isLive = statusState === 'in';
                const minuteDisplay = event.status.displayClock || "LIVE";
                
                const eventDate = new Date(event.date);
                const timeWIB = eventDate.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false }) + " WIB";

                const matchData = generateMatchData(event.id || (homeTeam.team.name + awayTeam.team.name));

                matchesList.push({
                    league: leagueName,
                    teamHome: homeTeam.team.shortDisplayName || homeTeam.team.name,
                    teamAway: awayTeam.team.shortDisplayName || awayTeam.team.name,
                    logoHome: homeTeam.team.logo || "https://cdn-icons-png.flaticon.com/512/53/53283.png",
                    logoAway: awayTeam.team.logo || "https://cdn-icons-png.flaticon.com/512/53/53283.png",
                    scoreHome: isLive ? homeTeam.score : "-",
                    scoreAway: isLive ? awayTeam.score : "-",
                    time: timeWIB,
                    isLive: isLive,
                    minute: minuteDisplay,
                    hdp: matchData.hdp,
                    prediction: matchData.prediction
                });
            });

            renderMatchesToUI(matchesList);
        }

        // PARSER 2: DATA API-FOOTBALL (RAPIDAPI / API-SPORTS)
        function parseApiFootballData(fixtures) {
            let matchesList = [];

            fixtures.forEach(item => {
                const fixture = item.fixture;
                const league = item.league;
                const teams = item.teams;
                const goals = item.goals;

                const matchData = generateMatchData(fixture.id.toString());
                const statusShort = fixture.status.short;

                // Status Live: 1H (Babak 1), HT (Istirahat), 2H (Babak 2), ET, P
                const isLive = ["1H", "HT", "2H", "ET", "P", "LIVE"].includes(statusShort);
                const minuteDisplay = fixture.status.elapsed ? `${fixture.status.elapsed}'` : "LIVE";

                const eventDate = new Date(fixture.date);
                const timeWIB = eventDate.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false }) + " WIB";

                matchesList.push({
                    league: league.name.toUpperCase(),
                    teamHome: teams.home.name,
                    teamAway: teams.away.name,
                    logoHome: teams.home.logo || "https://cdn-icons-png.flaticon.com/512/53/53283.png",
                    logoAway: teams.away.logo || "https://cdn-icons-png.flaticon.com/512/53/53283.png",
                    scoreHome: isLive ? (goals.home !== null ? goals.home : 0) : "-",
                    scoreAway: isLive ? (goals.away !== null ? goals.away : 0) : "-",
                    time: timeWIB,
                    isLive: isLive,
                    minute: minuteDisplay,
                    hdp: matchData.hdp,
                    prediction: matchData.prediction
                });
            });

            renderMatchesToUI(matchesList);
        }

        // PARSER 3: FALLBACK ENGINE ENGINE DYNAMIC
        function loadDynamicScoreEngine() {
            const now = new Date();
            const formatTime = (offsetMinutes) => {
                const d = new Date(now.getTime() + offsetMinutes * 60000);
                return d.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false }) + " WIB";
            };

            const dynamicMatches = [
                {
                    league: "ENGLISH PREMIER LEAGUE",
                    teamHome: "Manchester City",
                    teamAway: "Liverpool FC",
                    logoHome: "https://a.espncdn.com/i/teamlogos/soccer/500/382.png",
                    logoAway: "https://a.espncdn.com/i/teamlogos/soccer/500/364.png",
                    scoreHome: "2",
                    scoreAway: "1",
                    time: formatTime(-60),
                    isLive: true,
                    minute: "82'",
                    hdp: "0 : 1/2",
                    prediction: "2 - 1"
                },
                {
                    league: "ENGLISH PREMIER LEAGUE",
                    teamHome: "Arsenal FC",
                    teamAway: "Chelsea FC",
                    logoHome: "https://a.espncdn.com/i/teamlogos/soccer/500/359.png",
                    logoAway: "https://a.espncdn.com/i/teamlogos/soccer/500/363.png",
                    scoreHome: "1",
                    scoreAway: "0",
                    time: formatTime(-25),
                    isLive: true,
                    minute: "38'",
                    hdp: "0 : 1/4",
                    prediction: "2 - 0"
                },
                {
                    league: "SPANISH LA LIGA",
                    teamHome: "Real Madrid",
                    teamAway: "FC Barcelona",
                    logoHome: "https://a.espncdn.com/i/teamlogos/soccer/500/86.png",
                    logoAway: "https://a.espncdn.com/i/teamlogos/soccer/500/83.png",
                    scoreHome: "-",
                    scoreAway: "-",
                    time: formatTime(90),
                    isLive: false,
                    minute: "UPCOMING",
                    hdp: "0 : 1/4",
                    prediction: "3 - 2"
                }
            ];

            renderMatchesToUI(dynamicMatches);
        }

        // RENDER MATCHES KE TAMPILAN
        function renderMatchesToUI(matches) {
            const sliderContainer = document.getElementById('horizontal-match-slider');
            sliderContainer.innerHTML = '';
            allMatchesGrouped = {};

            matches.forEach(matchObj => {
                const sliderCard = `
                    <div onclick="goToDaftar()" class="min-w-[250px] glass-card p-3 rounded-xl border ${matchObj.isLive ? 'border-amber-500/60' : 'border-slate-800'} cursor-pointer flex-shrink-0 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center text-[10px] mb-1.5">
                                <span class="league-badge bg-blue-900/80 text-cyan-300 truncate max-w-[120px]">${matchObj.league}</span>
                                ${matchObj.isLive ? `<span class="px-2 py-0.5 rounded bg-emerald-500 text-slate-950 font-black animate-pulse">${matchObj.minute}</span>` : `<span class="text-cyan-400 font-mono">${matchObj.time}</span>`}
                            </div>
                            <div class="space-y-1 text-xs font-bold text-white mb-2">
                                <div class="flex justify-between items-center"><span><img src="${matchObj.logoHome}" class="team-logo-sm mr-1" onerror="handleImgError(this)"> ${matchObj.teamHome}</span><span class="${matchObj.isLive ? 'text-amber-400 font-extrabold' : 'text-gray-400'}">${matchObj.scoreHome}</span></div>
                                <div class="flex justify-between items-center"><span><img src="${matchObj.logoAway}" class="team-logo-sm mr-1" onerror="handleImgError(this)"> ${matchObj.teamAway}</span><span class="${matchObj.isLive ? 'text-amber-400 font-extrabold' : 'text-gray-400'}">${matchObj.scoreAway}</span></div>
                            </div>
                        </div>
                        <div class="pt-2 border-t border-slate-800/80 flex justify-between items-center text-[10px]">
                            <span class="text-amber-300 font-semibold"><i class="fa-solid fa-chart-line text-[9px] mr-1"></i>HDP: <strong class="text-white">${matchObj.hdp}</strong></span>
                            <span class="text-cyan-300 font-semibold"><i class="fa-solid fa-bullseye text-[9px] mr-1"></i>Pred: <strong class="text-emerald-400">${matchObj.prediction}</strong></span>
                        </div>
                    </div>
                `;
                sliderContainer.innerHTML += sliderCard;

                if (!allMatchesGrouped[matchObj.league]) allMatchesGrouped[matchObj.league] = [];
                allMatchesGrouped[matchObj.league].push(matchObj);
            });

            startHorizontalAutoScroll();
            renderMatchList();
        }

        // Render Match List Utama
        function renderMatchList(keyword = '') {
            const listContainer = document.getElementById('match-list');
            listContainer.innerHTML = '';

            let hasMatches = false;

            Object.keys(allMatchesGrouped).forEach(league => {
                const filteredMatches = allMatchesGrouped[league].filter(m => {
                    const searchStr = `${league} ${m.teamHome} ${m.teamAway}`.toLowerCase();
                    return searchStr.includes(keyword.toLowerCase().trim());
                });

                if (filteredMatches.length > 0) {
                    hasMatches = true;
                    let matchesHTML = '';

                    filteredMatches.forEach(m => {
                        matchesHTML += `
                            <div onclick="goToDaftar()" class="p-3 bg-slate-900/80 rounded-xl border ${m.isLive ? 'border-amber-500/60' : 'border-slate-800'} hover:border-cyan-500/50 cursor-pointer flex flex-wrap justify-between items-center gap-3 transition">
                                <div class="text-xs font-mono min-w-[90px]">
                                    ${m.isLive ? `<span class="px-2 py-0.5 rounded bg-emerald-500 text-slate-950 font-black text-[10px] animate-pulse">${m.minute}</span>` : `<span class="px-2 py-0.5 rounded bg-slate-800 text-gray-300 font-bold text-[10px]">UPCOMING</span>`}
                                    <div class="text-[10px] ${m.isLive ? 'text-emerald-400' : 'text-cyan-400'} mt-1 font-bold">${m.time}</div>
                                </div>

                                <div class="flex-grow space-y-1 min-w-[180px]">
                                    <div class="text-xs font-bold text-white flex justify-between">
                                        <span class="flex items-center gap-1.5"><img src="${m.logoHome}" class="team-logo-sm" onerror="handleImgError(this)"> ${m.teamHome}</span>
                                        <span class="${m.isLive ? 'text-amber-400 font-black' : 'text-gray-400'}">${m.scoreHome}</span>
                                    </div>
                                    <div class="text-xs font-bold text-white flex justify-between">
                                        <span class="flex items-center gap-1.5"><img src="${m.logoAway}" class="team-logo-sm" onerror="handleImgError(this)"> ${m.teamAway}</span>
                                        <span class="${m.isLive ? 'text-amber-400 font-black' : 'text-gray-400'}">${m.scoreAway}</span>
                                    </div>
                                </div>

                                <div class="flex items-center gap-2 border-t md:border-t-0 md:border-l border-slate-800 pt-2 md:pt-0 md:pl-4 min-w-[200px] justify-between md:justify-end">
                                    <div class="text-left md:text-right space-y-0.5">
                                        <div class="text-[11px] text-amber-300 font-medium">
                                            <span class="text-slate-400">HDP:</span> <strong class="text-white font-mono">${m.hdp}</strong>
                                        </div>
                                        <div class="text-[11px] text-cyan-300 font-medium">
                                            <span class="text-slate-400">PREDIKSI:</span> <strong class="text-emerald-400 font-mono">${m.prediction}</strong>
                                        </div>
                                    </div>
                                    <span class="league-badge bg-cyan-950 border border-cyan-500/40 text-cyan-300 ml-2 hidden sm:inline-block">PRESET</span>
                                </div>
                            </div>
                        `;
                    });

                    listContainer.innerHTML += `
                        <div class="space-y-2">
                            <div class="league-header px-3 py-2 rounded-lg flex items-center justify-between">
                                <span class="text-xs sm:text-sm font-extrabold text-cyan-300 tracking-wider uppercase">🏆 ${league}</span>
                            </div>
                            ${matchesHTML}
                        </div>
                    `;
                }
            });

            if (!hasMatches) {
                listContainer.innerHTML = `<div class="text-center py-8 text-cyan-300/60 text-xs">Pertandingan "${keyword}" tidak ditemukan.</div>`;
            }
        }

        function filterMatches() {
            const query = document.getElementById('search-input').value;
            renderMatchList(query);
        }

        // Inisialisasi & Auto Refresh
        document.addEventListener('DOMContentLoaded', () => {
            fetchRealtimeMatches();
            setInterval(fetchRealtimeMatches, CONFIG.AUTO_REFRESH_SECONDS * 1000);
        });
    </script>

    <!-- ANTI-INSPECT SCRIPT -->
    <script>
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12') e.preventDefault();
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) e.preventDefault();
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) e.preventDefault();
        if (e.ctrlKey && (e.key === 's' || e.key === 'S')) e.preventDefault();
      });
    </script>
</body>
</html>
